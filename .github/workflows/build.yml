name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2t64 \
            patchelf \
            pandoc \
            libreoffice-writer \
            libreoffice-calc \
            libreoffice-impress \
            fonts-crosextra-carlito \
            fonts-crosextra-caladea

      - name: Instalar dependencias JS
        run: bun install

      - name: Comprobar tipos, frontend y tests
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/cache/cargo-target

      - name: Pruebas de Office y PDF con LibreOffice
        run: ./scripts/test-office.sh

      - name: Compilar
        run: bunx tauri build --bundles appimage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/cache/cargo-target

      - uses: actions/upload-artifact@v4
        with:
          name: convertall-linux
          path: cache/cargo-target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias JS
        run: bun install

      - name: Descargar motores para Windows
        shell: pwsh
        run: ./scripts/fetch-tools-windows.ps1

      - name: Compilar
        run: bunx tauri build --ci --no-bundle
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\cache\cargo-target

      - name: Crear paquete portable
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = "cache/portable/ConvertAll"
          New-Item -ItemType Directory -Force -Path "$stage/tools", "$stage/licenses" | Out-Null

          Copy-Item "cache/cargo-target/release/convertall.exe" "$stage/ConvertAll.exe"
          Copy-Item "src-tauri/resources/windows/ffmpeg.exe" "$stage/tools/"
          Copy-Item "src-tauri/resources/windows/ffprobe.exe" "$stage/tools/"
          Copy-Item "src-tauri/resources/windows/pandoc.exe" "$stage/tools/"
          Copy-Item "src-tauri/resources/windows/magick" "$stage/tools/magick" -Recurse
          Copy-Item "src-tauri/resources/windows/licenses/*" "$stage/licenses/" -Recurse

          @"
          ConvertAll $version (portable)

          No requiere instalación.

          1. Descomprime este archivo .7z y abre la carpeta ConvertAll.
          2. Ejecuta ConvertAll.exe.
          3. No muevas la carpeta tools: contiene FFmpeg, Pandoc e ImageMagick.

          Puedes crear un acceso directo a ConvertAll.exe.
          WebView2 es necesario (incluido en Windows 11 y en la mayoría de Windows 10).
          Si falta: https://developer.microsoft.com/microsoft-edge/webview2/

          Windows 11 abre .7z de forma nativa. En Windows 10 necesitas 7-Zip
          (https://www.7-zip.org/) u otro descompresor compatible.
          "@ | Set-Content -Path "$stage/LEEME.txt" -Encoding UTF8

          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          Push-Location "cache/portable"
          try {
            & $sevenZip a -t7z -mx=9 "ConvertAll_${version}_x64-portable.7z" "ConvertAll" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el paquete .7z" }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: convertall-windows
          path: cache/portable/*.7z
          if-no-files-found: error
