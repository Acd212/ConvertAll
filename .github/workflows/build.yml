name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Instalar dependencias JS
        run: bun install

      - name: Comprobar tipos, frontend y tests
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/cache/cargo-target

      - name: Compilar
        run: bunx tauri build --bundles deb
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/cache/cargo-target

      - uses: actions/upload-artifact@v4
        with:
          name: convertall-linux
          path: cache/cargo-target/release/bundle/deb/*.deb
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias JS
        run: bun install

      - name: Descargar motores para Windows
        shell: pwsh
        run: ./scripts/fetch-tools-windows.ps1

      - name: Compilar
        run: bunx tauri build --ci
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\cache\cargo-target

      - uses: actions/upload-artifact@v4
        with:
          name: convertall-windows
          path: |
            cache/cargo-target/release/bundle/msi/*.msi
            cache/cargo-target/release/bundle/nsis/*.exe
          if-no-files-found: error
