[package]
name = "convertall"
version = "0.1.2"
description = "Conversor de archivos local para Linux y Windows"
authors = ["Acd212"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Acd212/ConvertAll"

[lib]
name = "convertall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
